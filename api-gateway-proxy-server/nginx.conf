events {}

http {
  # Docker DNS noi bo: cho phep resolve lai ten container khi IP thay doi
  # (sau moi lan docker compose up / recreate) ma khong can restart proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Mo rong 10: can bang tai Round Robin giua 2 web server
  # resolve: cap nhat IP moi khi container web bi recreate
  upstream web_backend {
    zone web_backend 64k;
    server web-frontend-server1:80 resolve;
    server web-frontend-server2:80 resolve;
  }

  server {
    listen 80;
    client_max_body_size 20m;

    # Web tinh (round robin qua 2 web server)
    location / {
      proxy_pass http://web_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App API (strip /api/)
    # Dung bien + resolver de tu cap nhat IP container backend
    location /api/ {
      set $app_upstream application-backend-server;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$app_upstream:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mo rong 9: route /student/ -> API /student cua backend
    location /student/ {
      set $app_upstream application-backend-server;
      rewrite ^/student/(.*)$ /student$1 break;
      proxy_pass http://$app_upstream:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak
    location /auth/ {
      set $auth_upstream authentication-identity-server;
      rewrite ^/auth/(.*)$ /$1 break;
      proxy_pass http://$auth_upstream:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
